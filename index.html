<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fast, responsive HTML5 obstacle game. Tap or press Space to jump, avoid obstacles, and beat your best score.">
  <title>Jump & Dodge Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="game-card" aria-label="Jump and Dodge game">
      <header class="topbar">
        <div>
          <p class="eyebrow">HTML5 MINI GAME</p>
          <h1>Jump & Dodge</h1>
        </div>
        <div class="stats">
          <div><span>Score</span><strong id="score">0</strong></div>
          <div><span>Best</span><strong id="best">0</strong></div>
        </div>
      </header>

      <div class="game-wrap">
        <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>

        <div id="startOverlay" class="overlay">
          <div class="panel">
            <div class="icon">▲</div>
            <h2>Ready?</h2>
            <p>Jump over the obstacles and survive as long as you can.</p>
            <button id="startBtn">Start Game</button>
            <small>Space / ↑ / Click / Tap to jump</small>
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
          <div class="panel">
            <div class="icon danger">×</div>
            <h2>Game Over</h2>
            <p>Your score: <strong id="finalScore">0</strong></p>
            <button id="restartBtn">Play Again</button>
            <small>Press R or tap the button to restart</small>
          </div>
        </div>
      </div>

      <footer class="instructions">
        <span>SPACE / ↑</span> Jump
        <span>•</span>
        <span>CLICK / TAP</span> Jump
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
